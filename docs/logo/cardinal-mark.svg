<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">Cardinal</title>


  <!-- compass ring -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="#9b978e" stroke-width="3" stroke-opacity="0.5"/>

  <!-- east, south, west: each point split into a lit half and a shaded half -->
