    <path d="M228 128 L143.6 112.4 L128 128 Z"/>
    <path d="M128 228 L143.6 143.6 L128 128 Z"/>
    <path d="M28 128 L112.4 143.6 L128 128 Z"/>
  </g>
  <g fill="#9b978e">
    <path d="M228 128 L143.6 143.6 L128 128 Z"/>
    <path d="M128 228 L112.4 143.6 L128 128 Z"/>
    <path d="M28 128 L112.4 112.4 L128 128 Z"/>
  </g>

  <!-- north: the one direction, in gold -->
  <path d="M128 24 L112.4 112.4 L128 128 Z" fill="#d4af37"/>
  <path d="M128 24 L143.6 112.4 L128 128 Z" fill="#8f7328"/>

  <circle cx="128" cy="128" r="7" fill="#17171b" stroke="#d4af37" stroke-width="3"/>
