# Values of this project that Cardinal, the shared agent harness, reads. Owned by the project: `cardinal sync` never
# rewrites it.

[project]
# Scopes allowed in commit messages besides `docs` and `cardinal` (crates, areas).
commit_scopes = []
# Documents at the repository root that skills may cite besides AGENTS.md and CLAUDE.md.
root_docs = ["README.md"]
# Directories that scripts do not scan besides .git, node_modules and the build output (target).
skipped_dirs = []
# File-name patterns of the test files whose `spec:` citations `check-specs` reads (default ["*.rs"]), e.g.
# ["test_*.py", "*_test.go"]; each is read with the line-comment marker of its extension.
# spec_files = ["*.rs"]
# Where the agent finds the context of the project (issue-workflow, create-issue, prioritize-issues).
roadmap = ["docs/TODO.md"]
architecture = "docs/architecture.md"
# Where the rules for writing tests are (issue-workflow, step "test first").
test_conventions = "CLAUDE.md"
# What must never be named in an issue or a committed file (create-issue); generic wording only.
confidential = "nothing is confidential"
# Language of the conversation with the user (skills, code, docs and issues stay in English).
user_language = "English"
# Bytes of the memory files and skill descriptions every session loads; `check`, `sync` and `update` warn above it.
# fixed_context_budget = 12000
