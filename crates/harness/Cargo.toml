[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Synchronise the shared agent harness (skills, hooks, scripts) into a project"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
