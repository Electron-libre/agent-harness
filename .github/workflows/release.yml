name: Release

# Publish the `cardinal` binary of every commit of the main branch, so a project pinned to it runs its tools without
# Rust (ADR 0010, specs/tool-binaries.md BIN-3): release `cardinal-<commit>`, assets `cardinal-<target>` and
# `cardinal-<target>.sha256`. The commits from before the rename keep their `harness-<commit>` releases, which
# `cardinal run` still reads.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          # static Linux binaries: a `gnu` one built here would need this runner's glibc
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain for the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y musl-tools; fi
      - run: cargo build --release --locked -p cardinal --bin cardinal --target ${{ matrix.target }}
      - name: Name the assets and their digests
        run: |
          mkdir dist
          cd dist
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          cp "../target/${{ matrix.target }}/release/cardinal" "cardinal-${{ matrix.target }}"
          $sum "cardinal-${{ matrix.target }}" > "cardinal-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cardinal-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release of the commit (or complete it, on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cardinal-${{ github.sha }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/cardinal-* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" dist/cardinal-* \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "cardinal ${{ github.sha }}" \
              --notes "The cardinal binary of ${{ github.sha }}, fetched by \`cardinal run\`." \
              --latest=false
          fi
