name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, tests, drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cargo fmt --all --check
      - run: just clippy test check-harness
      # last and alone: its `*args` would take the recipe names that follow as arguments
      - run: just check-specs
