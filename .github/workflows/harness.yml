name: Harness

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: agent harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain (the project's pinned one, else stable)
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          else
            rustup toolchain install stable --profile minimal -c rustfmt,clippy
          fi
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,rust-script
      - name: Install harness (the release of the pinned revision, else built)
        run: sh .github/install_harness.sh
      - run: just test-harness
      - run: just check-specs
      - name: Check that no synced file was edited
        run: |
          if command -v harness >/dev/null; then harness check; else echo "harness not installed: check-harness skipped"; fi

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install harness (the release of the pinned revision, else built with the runner's cargo)
        run: sh .github/install_harness.sh
      - name: Check every commit of the PR
        run: just check-commits ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
