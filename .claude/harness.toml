[harness]
source = "."

# Values of this project that the shared harness reads. Owned by the project: `harness sync` never rewrites it.

[project]
# Scopes allowed in commit messages besides `docs` and `harness` (crates, areas).
commit_scopes = ["sync", "files"]
# Documents at the repository root that skills may cite besides AGENTS.md and CLAUDE.md.
root_docs = ["README.md"]
# Directories that scripts do not scan besides .git, node_modules and the build output (target).
skipped_dirs = []
# Where the agent finds the context of the project (issue-workflow, create-issue, prioritize-issues).
roadmap = ["issues/queue.md"]
architecture = "docs/architecture.md"
# Where the rules for writing tests are (issue-workflow, step "test first").
test_conventions = "CLAUDE.md"
# What must never be named in an issue or a committed file (create-issue); generic wording only.
confidential = "name no private project of the user in a shared file or an issue; the shared harness must hold nothing specific to one project"
# Language of the conversation with the user (skills, code, docs and issues stay in English).
user_language = "French"
# Bytes of CLAUDE.md, AGENTS.md and skill descriptions every session loads; `check`, `sync` and `update` warn above it.
fixed_context_budget = 10000
